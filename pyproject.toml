[project]
name = "auditry"
version = "0.3.1"
description = "Observability middleware for FastAPI and Quart with request/response logging, request IDs, and sensitive data redaction"
authors = [
    {name = "Liv Stark", email = "livstark.work@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
keywords = ["fastapi", "quart", "observability", "logging", "middleware", "request-id", "redaction"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Framework :: FastAPI",
    "Framework :: AsyncIO",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Logging",
]

dependencies = [
    "pydantic>=2.0.0",
    "structlog>=23.0.0",
    "asgi-correlation-id>=4.0.0",
]

[project.optional-dependencies]
fastapi = [
    "fastapi>=0.100.0",
    "starlette>=0.27.0",
]
quart = [
    "quart>=0.18.0",
]
all = [
    "fastapi>=0.100.0",
    "starlette>=0.27.0",
    "quart>=0.18.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-timeout>=2.0.0",
    "httpx>=0.24.0",
    "mypy>=1.0.0",
    # Pinned rather than floated: CI, pre-commit and every developer have to
    # agree on what counts as a violation. Bump here and the workflows follow,
    # because they install ruff from this lock rather than from a second pin.
    "ruff==0.16.1",
]

[project.urls]
Homepage = "https://github.com/farsight-ai/auditry"
Repository = "https://github.com/farsight-ai/auditry"
Issues = "https://github.com/farsight-ai/auditry/issues"

[build-system]
requires = ["setuptools>=61.0,<70.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["auditry", "auditry.core", "auditry.fastapi", "auditry.quart"]
package-dir = {"" = "src"}

[tool.setuptools.package-data]
auditry = ["py.typed"]

[tool.ruff]
line-length = 100
# The oldest interpreter in requires-python: UP rewrites are only safe up to it.
target-version = "py39"
src = ["src"]
exclude = [".venv", "venv", "__pycache__", "build", "dist"]
# The formatter also rewrites Python code blocks inside Markdown. The README's
# samples are annotated by hand -- blank-line grouping and aligned comments
# that carry meaning -- so docs are left to their authors.
# https://docs.astral.sh/ruff/formatter/
extend-exclude = ["*.md"]
# Without this, an exclusion only holds while ruff is walking a directory: a
# path named on the command line is processed anyway. pre-commit passes each
# changed file by name, so the README would come back reformatted.
force-exclude = true

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "B", "C4", "PT", "UP"]
# E501: the formatter already wraps code to line-length. What survives is long
# strings, URLs and comments, which it deliberately does not rewrap.
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
# Hard ceiling so a regressed event-loop spin (see DEV-1150) fails fast in CI
# instead of hanging the run indefinitely.
timeout = 30
timeout_method = "thread"

[tool.mypy]
python_version = "3.9"
strict = true
warn_return_any = true
warn_unused_configs = true
no_implicit_reexport = true
