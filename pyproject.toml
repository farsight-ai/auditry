[project]
name = "auditry"
version = "0.6.0"
description = "Observability middleware for FastAPI and Quart with request/response logging, request IDs, sensitive data redaction, and OpenTelemetry tracing"
authors = [
    {name = "Ilana Zane", email = "ilana@farsight-ai.com"},
    {name = "Colin Stark"} 
]
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
keywords = ["fastapi", "quart", "observability", "logging", "middleware", "request-id", "redaction", "opentelemetry", "tracing"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Framework :: FastAPI",
    "Framework :: AsyncIO",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Logging",
]

dependencies = [
    "pydantic>=2.0.0",
    "structlog>=23.0.0",
    "asgi-correlation-id>=4.0.0",
]

[project.optional-dependencies]
fastapi = [
    "fastapi>=0.100.0",
    "starlette>=0.27.0",
]
quart = [
    "quart>=0.18.0",
]
otel = [
    "opentelemetry-api>=1.45.1,<2",
    "opentelemetry-sdk>=1.45.1,<2",
    "opentelemetry-exporter-otlp-proto-http>=1.45.1,<2",
    "opentelemetry-instrumentation-asgi>=0.66b1",
    "opentelemetry-instrumentation-fastapi>=0.66b1",
]
all = [
    "fastapi>=0.100.0",
    "starlette>=0.27.0",
    "quart>=0.18.0",
    "opentelemetry-api>=1.45.1,<2",
    "opentelemetry-sdk>=1.45.1,<2",
    "opentelemetry-exporter-otlp-proto-http>=1.45.1,<2",
    "opentelemetry-instrumentation-asgi>=0.66b1",
    "opentelemetry-instrumentation-fastapi>=0.66b1",
]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-timeout>=2.0.0",
    "httpx>=0.24.0",
    "mypy>=1.0.0",
    # Pinned rather than floated: CI, pre-commit and every developer have to
    # agree on what counts as a violation. Bump here and the workflows follow,
    # because they install ruff from this lock rather than from a second pin.
    "ruff==0.16.1",
    # The shell toolchain, for scripts/. Both are binaries rather than Python,
    # but these wheels carry them, which keeps one install path (uv.lock) and
    # one pinned version shared by CI and every developer -- as opposed to
    # Homebrew locally and apt in CI, which drift.
    "shellcheck-py==0.11.0.1",
    "shfmt-py==4.2.0",
]

[project.urls]
Homepage = "https://github.com/farsight-ai/auditry"
Repository = "https://github.com/farsight-ai/auditry"
Issues = "https://github.com/farsight-ai/auditry/issues"

# OTEL_TRACES_EXPORTER=auditry_otlp (or auditry_console) selects these in
# zero-code setup; the SDK constructs them with no arguments.
[project.entry-points.opentelemetry_traces_exporter]
auditry_otlp = "auditry.otel.exporter:ScrubbingOTLPSpanExporter"
auditry_console = "auditry.otel.exporter:ScrubbingConsoleSpanExporter"

[build-system]
requires = ["setuptools>=61.0,<70.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["auditry", "auditry.core", "auditry.fastapi", "auditry.otel", "auditry.quart"]
package-dir = {"" = "src"}

[tool.setuptools.package-data]
auditry = ["py.typed"]

[tool.ruff]
line-length = 100
# The oldest interpreter in requires-python: UP rewrites are only safe up to it.
target-version = "py311"
src = ["src"]
exclude = [".venv", "venv", "__pycache__", "build", "dist"]
# The formatter also rewrites Python code blocks inside Markdown. The README's
# samples are annotated by hand -- blank-line grouping and aligned comments
# that carry meaning -- so docs are left to their authors.
# https://docs.astral.sh/ruff/formatter/
extend-exclude = ["*.md"]
# Without this, an exclusion only holds while ruff is walking a directory: a
# path named on the command line is processed anyway. pre-commit passes each
# changed file by name, so the README would come back reformatted.
force-exclude = true

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "B", "C4", "PT", "UP"]
# E501: the formatter already wraps code to line-length. What survives is long
# strings, URLs and comments, which it deliberately does not rewrap.
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
# Hard ceiling so a regressed event-loop spin (see DEV-1150) fails fast in CI
# instead of hanging the run indefinitely.
timeout = 30
timeout_method = "thread"

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
no_implicit_reexport = true
