name: Lint

# Draft pull requests raise opened/synchronize/reopened like any other, so the
# defaults already cover them. ready_for_review is added so the check reports
# again when a draft is promoted, rather than showing the draft's last run.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

# One run per ref. A push to an open pull request cancels the run it replaced.
concurrency:
  group: lint-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      # Third-party actions are pinned to a full commit SHA. A tag, including a
      # patch tag, is mutable and can be repointed at different code; a SHA
      # cannot. The trailing comment is the release the SHA corresponds to, so
      # the pin stays readable and bumps stay reviewable.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      # --locked fails if uv.lock no longer matches pyproject.toml, so a
      # forgotten re-lock is caught here instead of at the next sync. Every
      # linter comes from the lock -- ruff, and the shellcheck/shfmt binaries
      # that ship inside wheels -- which is what makes the local run and this
      # one agree on what counts as a violation.
      - name: Install dependencies
        run: uv sync --all-extras --locked

      # Python: ruff check, then ruff format --check.
      # Shell:  shellcheck, then shfmt -d over every *.sh in the repo.
      # Writes nothing. ruff violations become inline annotations on the diff.
      - name: Lint (Python and shell)
        run: ./scripts/lintme.sh --check
